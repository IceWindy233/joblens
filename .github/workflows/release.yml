name: Release

# 推送形如 v0.1.0 的标签时：校验 → 打包扩展 zip 与 Android APK → 创建 GitHub Release 并附上两者。
# 标签版本必须与 package.json 的 version 一致（扩展 manifest 与 Android versionName/versionCode 都取自这里）。
#
# Android 正式签名所需的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   ANDROID_KEYSTORE_BASE64    release 密钥库文件的 base64
#   ANDROID_KEYSTORE_PASSWORD  密钥库密码
#   ANDROID_KEY_ALIAS          密钥别名
#   ANDROID_KEY_PASSWORD       密钥密码
# 缺少任何一项时工作流失败，不会发布未签名或调试签名的 APK。
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets for Android signing:$missing"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip

      # ---------- Android ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify APK signature and version
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          VERSION_NAME=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$VERSION_NAME" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::APK versionName $VERSION_NAME does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          cp "$APK" "dist/joblens-${VERSION_NAME}-android.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-chrome.zip
            dist/*-android.apk
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
