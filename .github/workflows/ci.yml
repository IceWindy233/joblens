name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # 版本取自 package.json 的 packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Build & zip
        run: pnpm zip

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: joblens-chrome-${{ github.sha }}
          path: dist/*-chrome.zip
          if-no-files-found: error
          retention-days: 14
